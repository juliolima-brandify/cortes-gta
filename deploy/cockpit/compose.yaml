name: cortes-gta

services:
  cockpit:
    image: nginx:stable-alpine
    user: "${COCKPIT_UID:?Defina COCKPIT_UID}:${COCKPIT_GID:?Defina COCKPIT_GID}"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/srv/cockpit:ro
      - ./run:/run/cockpit
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /run/cockpit/http.sock
        exec nginx -g 'daemon off;'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
