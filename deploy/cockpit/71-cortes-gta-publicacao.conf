Match User cortes-gta-publish
    ChrootDirectory /opt/cortes-gta/cockpit
    AuthorizedKeysFile /etc/ssh/authorized_keys/cortes-gta-publish
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    ForceCommand internal-sftp -d /frontend -u 022 -P symlink,hardlink
Match all
