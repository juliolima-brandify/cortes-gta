worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map_hash_bucket_size 64;
    map $http_origin $origem_torre {
        default "";
        "http://127.0.0.1:18767" "http://127.0.0.1:8767";
    }

    upstream torre {
        server unix:/run/cockpit/torre.sock;
    }

    server {
        listen unix:/run/cockpit/http.sock;
        server_tokens off;
        root /srv/cockpit;
        client_max_body_size 64k;

        if ($http_host != "127.0.0.1:18767") {
            return 403;
        }

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            try_files /index.html =404;
        }

        location ~ ^/(?:estilo\.css|app\.js|editor\.js|marca\.png|host-grotesk\.woff2)$ {
            try_files $uri =404;
        }

        location ~ ^/(?:api/(?:estado$|(?:revisao|edicao)/)|(?:canal|previa|quadro|vertical|quadro-vertical|rascunho)/) {
            proxy_pass http://torre;
            proxy_set_header Host 127.0.0.1:8767;
            proxy_set_header Origin $origem_torre;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_buffering off;
            proxy_connect_timeout 3s;
        }

        location / {
            return 404;
        }
    }
}
